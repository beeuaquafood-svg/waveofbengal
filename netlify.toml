[build]
  base = "frontend"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Build static export version for Netlify
# Note: This only works if your Next.js app is fully static (no API routes/SSR)

# Cache settings for static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache settings for other static files
[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Don't cache HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Production environment
