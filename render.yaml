services:
  # Frontend - Next.js on Netlify (separate deployment)
  # Backend - FastAPI on Render
  - type: web
    name: wave-of-bengal-api
    runtime: python
    region: oregon
    plan: free
    
    rootDir: backend
    
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_PASS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: wave-of-bengal
    
    healthCheckPath: /api/health
    healthCheckInterval: 30
    
    autoDeploy: true
